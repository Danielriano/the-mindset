<!-- Registra qué enlace se toca, no solo que alguien entró. Es el dato
     que dice qué producto vende. Toma el nombre del propio botón, así
     que al añadir enlaces nuevos no hay que tocar nada aquí. -->
<script>
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href^="http"]');
  if (!a || typeof fbq !== 'function') return;
  var t = a.querySelector('.boton__texto');
  fbq('trackCustom', 'ClicEnlace', {
    enlace: t ? t.textContent.trim() : (a.getAttribute('aria-label') || a.href),
    sitio: location.hostname
  });
});
</script>
